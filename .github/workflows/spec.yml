name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Spec Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Setup (vendor deps + icons)
        run: npm run setup

      - name: Spec check (lint, format, types, line counts)
        run: npm run spec all

  # test job disabled — integration tests time out in CI (Playwright/server)
  # test:
