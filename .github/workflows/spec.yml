name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  spec:
    name: Spec Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Setup (vendor deps + icons)
        run: npm run setup

      - name: Spec check (lint, format, types, line counts)
        run: npm run spec all

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Setup (vendor deps + icons)
        run: npm run setup

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Tests
        run: npm test
